<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRE Track</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" data-i18n-attr="aria-label:app.openTrackMapAria"><span aria-hidden="true">☰</span> <span class="lbl" data-i18n="app.trackBtn">Track</span></button>
  <button class="brand" id="homeBtn" data-i18n-attr="title:app.overviewTitle"><span class="mark">SRE</span><span class="bname">SRE Track</span><small data-i18n="app.tagline">mastery course</small></button>
  <div class="stats">
    <div class="stat hide-sm"><span class="v" id="stStreak">0</span><span class="k" data-i18n="app.streak">streak</span></div>
    <div class="stat hide-sm"><span class="v" id="stAcc">–</span><span class="k" data-i18n="app.accuracy">accuracy</span></div>
    <div class="xpwrap">
      <div class="row"><b id="stRank">Pager Rookie</b><span id="stXp">0 XP</span></div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
    <select class="langsel" id="langSel" data-i18n-attr="aria-label:app.langLabel"></select>
    <button class="iconbtn" id="profileBtn" data-i18n="app.badgesBtn">Badges</button>
  </div>
</header>
<div class="shell">
  <nav class="sidebar" id="sidebar" data-i18n-attr="aria-label:app.trackMapAria"></nav>
  <main class="main"><div class="page" id="view"></div></main>
</div>
<div class="toasts" id="toasts"></div>
<script src="i18n/manifest.js"></script>
<script src="i18n/boot.js"></script>
</body>
</html>
